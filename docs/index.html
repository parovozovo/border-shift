<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E2420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Border Shift">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231B3B2B'/%3E%3Cstop offset='1' stop-color='%230E1914'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 4L56 14v18c0 14-10 24-24 28C18 56 8 46 8 32V14L32 4z' fill='url(%23g)' stroke='%23E0B145' stroke-width='3'/%3E%3Crect x='14' y='28' width='36' height='7' rx='2' fill='%23C62828'/%3E%3Crect x='22' y='28' width='8' height='7' fill='%23ECEFF1'/%3E%3Crect x='38' y='28' width='8' height='7' fill='%23ECEFF1'/%3E%3Cpolygon points='32,12 35,20 43,20 36,24 38,32 32,27 26,32 28,24 21,20 29,20' fill='%23E0B145'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css?v=7.8">
  <title>Border Shift: Kraina</title>
</head>
<body>
  <main id="app-shell" aria-live="polite"></main>

  <!-- Native modal dialog for Rules (light-dismissable) -->
  <dialog id="rules-dialog" closedby="any" aria-labelledby="rules-dialog-title">
    <h2 id="rules-dialog-title" style="color: #E0B145; font-size: 18px;">Директиви на зміну</h2>
    <div id="rules-dialog-body" style="display: flex; flex-direction: column; gap: 8px; font-size: 13px;"></div>
    <form method="dialog">
      <button type="submit" value="close" class="btn-mustard" style="width: 100%; padding: 10px;" autofocus>Зрозуміло / Got it</button>
    </form>
  </dialog>

  <!-- Native modal dialog for Wanted Mugshot Dossier (light-dismissable) -->
  <dialog id="wanted-dialog" closedby="any" aria-labelledby="wanted-dialog-title">
    <h2 id="wanted-dialog-title" style="color: #FF5252; font-size: 18px;">🎯 ДОВІДНИК РОЗШУКУ СБК</h2>
    <p id="wanted-dialog-sub" style="font-size: 12px; color: #CFD8DC;">Орієнтування на зміну: у цих осіб гарантовані порушення в документах або багажі.</p>
    <div id="wanted-dialog-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
    <form method="dialog">
      <button type="submit" value="close" class="btn-mustard" style="width: 100%; padding: 10px;" autofocus>Закрити довідник</button>
    </form>
  </dialog>

  <!-- Native modal dialog for Air-Raid Siren -->
  <dialog id="siren-dialog" closedby="none" aria-labelledby="siren-dialog-title">
    <h2 id="siren-dialog-title" style="color: #FF5252; font-size: 18px; text-align: center;">🚨 ПОВІТРЯНА ТРИВОГА!</h2>
    <p id="siren-dialog-desc" style="font-size: 13px; line-height: 1.45; text-align: center;"></p>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button type="button" id="btn-siren-shelter" class="btn-primary-blue" autofocus></button>
      <button type="button" id="btn-siren-work" class="btn-primary-red"></button>
    </div>
  </dialog>

  <!-- Native modal dialog for Mid-Shift Special Encounters -->
  <dialog id="encounter-dialog" closedby="none" aria-labelledby="encounter-dialog-title">
    <h2 id="encounter-dialog-title" style="color: #E0B145; font-size: 18px; text-align: center;"></h2>
    <div style="display: flex; justify-content: center;">
      <canvas id="encounter-canvas" width="90" height="90" style="width: 76px; height: 76px; border-radius: 6px; background: #D7CCC8; border: 1.5px solid #4E342E;"></canvas>
    </div>
    <p id="encounter-dialog-desc" style="font-size: 13px; line-height: 1.45; white-space: pre-line;"></p>
    <div id="encounter-options" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </dialog>

  <script src="./game.js?v=7.8"></script></script></script></script></script>
</body>
</html>
